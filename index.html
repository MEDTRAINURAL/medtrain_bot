<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профессиональные чаты MEDTRAIN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#2eaabe;
    --accent-d:#1d8a9c;
    --accent-l:#6fd0e0;
    --ink:#0e3a42;
    --hint:#5a7a82;
    --card:#ffffff;
    --bg:#eef9fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.4;
    overflow-x:hidden;
    padding:0 16px calc(36px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    position:relative;
  }

  /* ── анимированный фон: плавающие пятна ── */
  .bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:
      radial-gradient(120% 80% at 50% -10%, #ffffff 0%, var(--bg) 55%);}
  .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5;}
  .blob.b1{width:300px;height:300px;background:#9be3ee;top:-80px;left:-90px;animation:drift1 16s ease-in-out infinite;}
  .blob.b2{width:260px;height:260px;background:#bdeef5;top:30%;right:-100px;animation:drift2 19s ease-in-out infinite;}
  .blob.b3{width:280px;height:280px;background:#7fd6e6;bottom:-90px;left:20%;animation:drift3 22s ease-in-out infinite;}
  @keyframes drift1{50%{transform:translate(60px,50px) scale(1.15);}}
  @keyframes drift2{50%{transform:translate(-50px,40px) scale(1.1);}}
  @keyframes drift3{50%{transform:translate(40px,-50px) scale(1.2);}}

  /* ── шапка ── */
  header{text-align:center;padding:34px 6px 24px;}
  .logo-wrap{
    opacity:0;transform:scale(.8) translateY(-10px);
    animation:logoIn .9s cubic-bezier(.34,1.4,.5,1) .1s forwards;
  }
  .logo-wrap img{
    max-width:188px;width:64%;height:auto;display:block;margin:0 auto;
    filter:drop-shadow(0 8px 22px rgba(46,170,190,.32));
    animation:float 5.5s ease-in-out 1s infinite;
  }
  @keyframes logoIn{to{opacity:1;transform:none;}}
  @keyframes float{50%{transform:translateY(-9px);}}

  h1{
    font-size:25px;font-weight:800;letter-spacing:-.3px;line-height:1.18;
    margin:20px auto 8px;max-width:300px;
    background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 38%,var(--accent-l) 50%,var(--ink) 62%,var(--ink) 100%);
    background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:fadeUp .8s ease .35s both, shine 5s linear 1.4s infinite;
  }
  .sub{
    font-size:15px;font-weight:600;color:var(--accent-d);margin:0;
    letter-spacing:.5px;
    animation:fadeUp .8s ease .5s both;
  }
  .sub b{font-weight:800;letter-spacing:1px;}
  @keyframes shine{to{background-position:-220% center;}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}

  /* ── список чатов ── */
  .list{display:flex;flex-direction:column;gap:11px;max-width:520px;margin:4px auto 0;}

  .card{
    background:var(--card);border-radius:18px;padding:13px 14px;
    display:flex;align-items:center;gap:13px;
    box-shadow:0 4px 18px rgba(20,80,90,.07);
    border:1px solid rgba(46,170,190,.12);
    opacity:0;transform:translateY(20px) scale(.98);
    animation:cardIn .6s cubic-bezier(.22,.7,.3,1) forwards;
    transition:transform .25s ease, box-shadow .25s ease;
  }
  .card:active{transform:scale(.985);}
  @media(hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(46,170,190,.22);}}
  @keyframes cardIn{to{opacity:1;transform:none;}}

  .chip{
    width:50px;height:50px;border-radius:14px;flex:0 0 50px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    box-shadow:0 4px 12px rgba(46,170,190,.3);
    position:relative;
  }
  .chip img{width:100%;height:100%;object-fit:cover;display:block;}
  .chip[data-letter]::after{
    content:attr(data-letter);color:#fff;font-weight:800;font-size:22px;
  }
  @media(hover:hover){.card:hover .chip{transform:rotate(-4deg) scale(1.05);transition:transform .3s;}}

  .name{flex:1;min-width:0;font-size:13.5px;font-weight:700;line-height:1.25;letter-spacing:-.1px;text-transform:uppercase;}

  .join{
    flex:0 0 auto;position:relative;overflow:hidden;cursor:pointer;border:none;
    font-family:inherit;font-size:13px;font-weight:700;color:#fff;
    padding:10px 17px;border-radius:12px;
    background:linear-gradient(135deg,var(--accent),var(--accent-d));
    box-shadow:0 4px 14px rgba(46,170,190,.4);
    transition:transform .14s ease, box-shadow .14s ease;
  }
  .join span{position:relative;z-index:1;}
  .join::before{
    content:'';position:absolute;top:0;left:-160%;width:55%;height:100%;
    background:linear-gradient(120deg,transparent,rgba(255,255,255,.85),transparent);
    transform:skewX(-22deg);
    animation:swipe 2.6s ease-in-out infinite;
  }
  @keyframes swipe{0%{left:-160%;}55%{left:160%;}100%{left:160%;}}
  .join:active{transform:scale(.93);box-shadow:0 2px 8px rgba(46,170,190,.35);}
  .join.done{background:linear-gradient(135deg,#7fd0dc,#5bbccb);}
  .join.done::before{animation:none;display:none;}

  footer{text-align:center;color:var(--hint);font-size:11.5px;margin-top:26px;font-weight:600;
    animation:fadeUp .8s ease 1s both;}
</style>
</head>
<body>

<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>

<header>
  <div class="logo-wrap">
    <img src="https://optim.tildacdn.com/tild6566-3666-4666-b830-666337666133/-/format/webp/logo_new.png.webp" alt="MEDTRAIN">
  </div>
  <h1>Профессиональные чаты по УЗД и ФД</h1>
  <p class="sub">Учебного центра <b>MEDTRAIN</b></p>
</header>

<div class="list" id="list"></div>

<footer>Откроется окно Telegram — вы подтвердите вступление сами</footer>

<script>
/* ====== СПИСОК ЧАТОВ ====== */
const CHATS = [
  { name:'Ультразвуковая ангиология',           img:'img/USAngio.png',  link:'https://t.me/usangio' },
  { name:'Эхокардиография',                      img:'img/echo.png',     link:'https://t.me/usecho' },
  { name:'Общая ультразвуковая диагностика',     img:'img/general.png',  link:'https://t.me/USGeneral' },
  { name:'УЗД в акушерстве и гинекологии',       img:'img/gyn.png',      link:'https://t.me/usgynecology' },
  { name:'Скелетно-мышечный ультразвук',         img:'img/skm.png',      link:'https://t.me/usmuscul' },
  { name:'УЗД в педиатрии',                      img:'img/uzd_ped.png',  link:'https://t.me/uspediatry' },
  { name:'Педиатрическая эхокардиография',       img:'img/Ped_echo.png', link:'https://t.me/PediatricEcho' },
  { name:'Функциональная диагностика',           img:'img/fd.png',       link:'https://t.me/FDmedtrain' },
];

const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

function haptic(){ try{ tg && tg.HapticFeedback.impactOccurred('light'); }catch(e){} }
function openTg(url){ if(tg && tg.openTelegramLink){ tg.openTelegramLink(url); } else { window.open(url,'_blank'); } }

function render(){
  const list = document.getElementById('list');
  CHATS.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.animationDelay = (0.15 + i*0.08).toFixed(2) + 's';

    const chip = document.createElement('div');
    chip.className = 'chip';
    const img = document.createElement('img');
    img.src = c.img; img.alt = '';
    img.onerror = function(){ chip.setAttribute('data-letter', c.name.trim()[0].toUpperCase()); img.remove(); };
    chip.appendChild(img);

    const name = document.createElement('div');
    name.className = 'name'; name.textContent = c.name;

    const btn = document.createElement('button');
    btn.className = 'join';
    btn.innerHTML = '<span>Вступить</span>';
    btn.addEventListener('click', () => {
      haptic(); openTg(c.link);
      btn.classList.add('done'); btn.innerHTML = '<span>Открыто</span>';
      setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = '<span>Вступить</span>'; }, 2500);
    });

    card.append(chip, name, btn);
    list.appendChild(card);
  });
}

if(tg){
  tg.ready(); tg.expand();
  try{ tg.setHeaderColor('#2eaabe'); }catch(e){}
  try{ tg.setBackgroundColor('#eef9fb'); }catch(e){}
}
render();
</script>
</body>
</html>
